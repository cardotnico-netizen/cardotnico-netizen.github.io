    --good:#3fd28e; --warn:#ffb938; --bad:#ff6b78; --gold:#ffcc33;
  }
}
:root[data-theme="dark"]{
  --bg:#141228; --surface:#1f1c3c; --card:#1f1c3c; --surface2:#2a2650; --ink:#efedff; --muted:#a39fc4; --line:#35305e;
  --accent:#a393ff; --accent-ink:#141228; --accent-soft:#322b66;
  --good:#3fd28e; --warn:#ffb938; --bad:#ff6b78; --gold:#ffcc33;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Coquille de l'appli ---------- */
#home{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;max-width:640px;width:100%;margin:0 auto}
.topbar h1{font:800 22px/1.1 var(--round);margin:0;flex:1;letter-spacing:-.01em}
.stat{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;font:800 14px var(--round);padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.stat.lvl{padding:3px 10px 3px 3px}
.stat.lvl b{background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px}
main#tabBody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.col{max-width:640px;margin:0 auto;padding:4px 16px 28px}
nav.nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
nav.nav .in{display:flex;max-width:640px;width:100%;margin:0 auto}
nav.nav button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font:700 11.5px var(--round);color:var(--muted)}
nav.nav button .ic{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
nav.nav button.on{color:var(--accent)}
nav.nav button.on .ic{filter:none;opacity:1}

/* ---------- Pastille de difficulté (le fil rouge du jeu) ---------- */
.dchip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--dc) 17%,transparent);border:1.5px solid color-mix(in srgb,var(--dc) 55%,transparent);border-radius:99px;padding:2px 10px 2px 2px;font:800 13px var(--round);white-space:nowrap;color:var(--ink)}
.dchip b{background:var(--dc);color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px;padding:0 4px}
.dchip.sm{padding:1px;border-width:0;background:none}
.dchip.sm b{min-width:19px;height:19px;font-size:11.5px}
.ladder{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;align-items:end;height:92px;margin:14px 0 6px}
.ladder i{display:block;border-radius:6px 6px 3px 3px;background:var(--dc);opacity:.22;position:relative}
.ladder i.on{opacity:1}
.ladder i span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:800 11px var(--round);color:#fff}
.ladder-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* ---------- Boutons ---------- */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 16px;font:800 15px var(--round);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.big{padding:15px 18px;font-size:17px;border-radius:16px;width:100%}
.btn.small{padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.stretch>*{flex:1}
.x{border:0;background:var(--surface2);width:38px;height:38px;border-radius:50%;font-size:17px;font-weight:800;flex-shrink:0;display:grid;place-items:center}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:9px;font:700 13.5px var(--round);color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* ---------- Carte des niveaux ---------- */
.daily{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin:6px 0 10px;text-align:left;width:100%}
.daily .cal{width:46px;height:50px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 20px/1 var(--round)}
.daily .cal small{font-size:10px;font-weight:700;opacity:.85;margin-bottom:2px}
.daily .dh{display:block;font:800 16px var(--round)}
.daily .dp{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.daily .done{color:var(--good);font:800 14px var(--round)}
.world{margin:22px 0 4px}
.wh{display:flex;align-items:baseline;gap:8px;margin:0 2px 4px}
.wh h2{font:800 18px/1.2 var(--round);margin:0;flex:1}
.wh .ws{font:700 13px var(--round);color:var(--muted);white-space:nowrap}
.wlock{font-size:13px;color:var(--muted);margin:0 2px 8px}
.path{position:relative}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trail path{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 11;vector-effect:non-scaling-stroke}
.node{position:absolute;width:66px;height:66px;border-radius:50%;border:0;padding:0;background:var(--surface);box-shadow:inset 0 0 0 4px var(--dc),0 4px 0 color-mix(in srgb,var(--dc) 60%,#000);font:800 21px var(--round);color:var(--ink);display:grid;place-items:center}
.node.played{background:var(--dc);color:#fff}
.node.locked{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--dc) 35%,var(--line)),0 4px 0 var(--line);color:var(--muted);background:var(--surface2);font-size:18px}
.node.here::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--dc);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.18);opacity:0}}
.node:active{transform:translateY(3px);box-shadow:inset 0 0 0 4px var(--dc),0 1px 0 color-mix(in srgb,var(--dc) 60%,#000)}
.nlab{position:absolute;max-width:46%;overflow-wrap:anywhere;font-size:12.5px;line-height:1.25;pointer-events:none}
.nlab b{display:block;font:800 13px/1.2 var(--round)}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:13px;height:13px;display:block;font-style:normal;font-size:12px;line-height:13px;color:var(--line)}
.pips i.s1{color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.pips i.s2{color:var(--gold)}
.pips i.s3{color:var(--gold);text-shadow:0 0 6px color-mix(in srgb,var(--gold) 70%,transparent)}

/* ---------- Pages Sans fin / Quiz ---------- */
.hero{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px 16px;margin:8px 0 14px}
.hero h2{font:800 24px/1.15 var(--round);margin:0 0 6px}
.hero p{margin:0 0 6px;color:var(--muted)}
.hsub{font:800 14px var(--round);margin:16px 0 8px}
.startd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.startd button{border:2px solid var(--dc);background:transparent;border-radius:14px;padding:9px 3px 8px;font:800 11.5px/1.2 var(--round);color:var(--ink);overflow:hidden;text-overflow:ellipsis;min-width:0}
.startd button b{display:block;font-size:22px;color:var(--dc)}
.startd button.on{background:var(--dc);color:#fff}
.startd button.on b{color:#fff}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rec{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.rec b{display:block;font:800 21px var(--round)}
.rec span{font-size:12px;color:var(--muted)}
.qtypes{display:grid;gap:8px}
.qtype{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.qtype .ic{font-size:26px;text-align:center}
.qtype b{font:800 14.5px var(--round)}
.qtype p{margin:1px 0 0;font-size:13px;color:var(--muted)}

/* ---------- Décor du parcours ---------- */
:root{--metal:#aeb3c4;--wood:#d39a52;--brass:#e5b43c;--head:#fbfaf4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--metal:#8a90a8;--wood:#c08443;--brass:#d6a432;--head:#e9e6f6}}
:root[data-theme="dark"]{--metal:#8a90a8;--wood:#c08443;--brass:#d6a432;--head:#e9e6f6}
.stk line{stroke:var(--wood);stroke-width:3.6;stroke-linecap:round}
.stage-hero{position:relative;display:grid;grid-template-columns:1fr minmax(150px,52%);align-items:end;gap:6px;background:color-mix(in srgb,var(--wc) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--wc) 40%,var(--line));border-radius:22px;padding:14px 10px 10px 16px;overflow:hidden}
.stage-hero::before{content:'';position:absolute;inset:auto -10% -40% -10%;height:70%;background:radial-gradient(ellipse at 70% 0%,color-mix(in srgb,var(--wc) 30%,transparent),transparent 70%);pointer-events:none}
.sh-t{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding-bottom:4px}
.sh-t small{font:700 12px var(--round);color:var(--muted)}
.sh-t b{font:800 22px/1.1 var(--round)}
.sh-t span{font:700 14px/1.25 var(--round);color:var(--muted);margin-bottom:10px}
.kit{width:100%;height:auto;position:relative}
.kstk{transform-box:view-box;transform-origin:34px 58px;animation:tapk .44s ease-in infinite}
.kstk.b{transform-origin:92px 56px;animation-name:tapk2;animation-delay:.22s}
@keyframes tapk{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(0)}}
@keyframes tapk2{0%,100%{transform:rotate(14deg)}50%{transform:rotate(0)}}
.fnote{animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translate(6px,-5px)}}
.whero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;background:color-mix(in srgb,var(--wc) 12%,var(--surface));border:1.5px solid color-mix(in srgb,var(--wc) 38%,var(--line));border-radius:20px;padding:12px 10px 12px 16px;margin-bottom:8px}
.whero small{font:700 12px var(--round);color:var(--muted)}
.whero h2{font:800 19px/1.15 var(--round);margin:0 0 4px}
.whero .ws{font:700 12.5px var(--round);color:var(--muted)}
.wdeco{width:78px;height:78px;animation:bob 5s ease-in-out infinite}
.wclosed .whero{filter:grayscale(.85);opacity:.7}
.wclosed .deco{filter:grayscale(1);opacity:.35}
.deco{position:absolute;width:64px;height:64px;pointer-events:none;opacity:.92;animation:bob 4.5s ease-in-out infinite}
.deco svg{width:100%;height:100%}
.deco.rise{animation:rise 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
@keyframes rise{0%,100%{transform:translateY(4px);opacity:.55}50%{transform:translateY(-8px) rotate(6deg);opacity:.95}}
.pend{transform-origin:40px 62px;animation:swing .9s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.here-stx{position:absolute;width:44px;height:30px;pointer-events:none;z-index:2}
.here-stx svg{width:100%;height:100%;overflow:visible}
.here-stx line{stroke:var(--wood);stroke-width:4;stroke-linecap:round}
.hs{transform-box:view-box}
.hs.a{transform-origin:6px 4px;animation:hit1 .6s ease-in infinite}
.hs.b{transform-origin:54px 4px;animation:hit2 .6s ease-in infinite;animation-delay:.3s}
@keyframes hit1{0%,100%{transform:rotate(-22deg)}45%{transform:rotate(0)}}
@keyframes hit2{0%,100%{transform:rotate(22deg)}45%{transform:rotate(0)}}
.hw{stroke:var(--accent);opacity:0;animation:wave .3s ease-out infinite}
@keyframes wave{0%{opacity:.9;transform:translateY(0)}100%{opacity:0;transform:translateY(4px)}}

/* ---------- Polyrythmie ---------- */
:root{--poly:#1e9bff}
.pads2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pads2 .pad span{font-size:30px;line-height:1}
.padG{background:color-mix(in srgb,var(--accent) 70%,#0a0630)}
.padsH{text-align:center;font:700 13px var(--round);color:var(--muted);min-height:0;margin-top:6px}
.padsH:empty{display:none}
#pPads:not(.hidden)~.padsH{display:block}
#pPads.hidden~.padsH{display:none}
.judge[data-side=l]{right:50%}
.judge[data-side=r]{left:50%}
.hand{font:800 11px var(--round);text-anchor:middle}
.hand.hD{fill:var(--accent)}
.hand.hG{fill:color-mix(in srgb,var(--accent) 60%,var(--ink))}
#endless.poly #eSvg{height:clamp(190px,32vh,330px)}
.bigstars i.poly.on{color:var(--poly);text-shadow:0 0 14px color-mix(in srgb,var(--poly) 60%,transparent)}
.pips i.sp{color:var(--line);margin-left:3px}
.pips i.sp.on{color:var(--poly);text-shadow:0 0 6px color-mix(in srgb,var(--poly) 60%,transparent)}
.polycard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border-radius:18px;padding:12px 14px;margin:10px 0 0;border:1.5px dashed color-mix(in srgb,var(--poly) 55%,var(--line));background:color-mix(in srgb,var(--poly) 8%,var(--surface));text-align:left;width:100%}
.polycard .pi{font-size:30px}
.polycard b{display:block;font:800 15px/1.2 var(--round)}
.polycard span{font-size:13px;color:var(--muted);line-height:1.35}
.polycard.on{border-style:solid}
.stage.polyst{border-color:color-mix(in srgb,var(--poly) 50%,var(--line));background:color-mix(in srgb,var(--poly) 7%,var(--surface))}
.stage .ps{font-size:22px;color:var(--line)}
.stage .ps.on{color:var(--poly)}
.polytog{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1.5px solid color-mix(in srgb,var(--poly) 50%,var(--line));background:color-mix(in srgb,var(--poly) 8%,var(--surface));border-radius:14px;padding:10px 12px;margin:10px 0 0}
.polytog b{font:800 14.5px var(--round)}
.polytog small{display:block;font-size:12px;color:var(--muted)}
.polytog.locked{border-style:dashed;opacity:.85}
.testbox{border:1.5px dashed var(--warn)}
/* Option de test temporaire masquée (le code reste en place pour pouvoir la réactiver) */
.testbox{display:none!important}

/* ---------- Icônes pixel & écrans Arcade / Quiz ---------- */
.pix{display:inline-block;vertical-align:-3px;flex-shrink:0}
nav.nav button .ic{filter:none!important;opacity:1!important;height:24px;display:grid;place-items:center;--pa:var(--muted)}
nav.nav button.on .ic{--pa:var(--accent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 12px}
.mode{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 12px;background:var(--surface);color:var(--ink);text-align:center}
.mode b{font:400 12px/1.4 var(--display);text-transform:uppercase}
.mode small{font:600 12.5px/1.25 var(--sans);color:var(--muted)}
.mode.on{background:var(--accent);color:var(--accent-ink);--pa:var(--accent-ink)}
.mode.on small{color:var(--accent-ink);opacity:.9}
.panel{background:var(--surface);padding:14px;margin-top:12px}
.ptitle{font:400 12px/1.5 var(--display);text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.rules{display:grid;gap:8px;margin:0}
.rule{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;font:600 14px/1.3 var(--sans)}
.rule .pix{--pa:var(--accent)}
.hiscore{margin:0;padding:0;list-style:none;font:700 14px var(--sans)}
.hiscore li{display:flex;align-items:baseline;gap:6px;padding:5px 0}
.hiscore li::after{content:'';order:1;flex:1;border-bottom:3px dotted var(--muted);transform:translateY(-4px)}
.hiscore li span{order:0}
.hiscore li b{order:2;font:400 13px var(--display)}
.qhead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;background:var(--surface);margin:8px 0 12px}
.qhead b{display:block;font:400 13px/1.5 var(--display);text-transform:uppercase}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font:700 12.5px var(--sans);padding:3px 8px;background:var(--surface2)}
.qkinds{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qkind{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px 8px;background:var(--surface)}
.qkind b{font:400 11px/1.5 var(--display);text-transform:uppercase}
.qkind small{font:600 12.5px/1.25 var(--sans);color:var(--muted)}
[data-skin=arcade] :is(.mode,.panel,.qhead,.qkind,.tag){border-radius:0;border:3px solid var(--line);box-shadow:4px 4px 0 var(--line)}
[data-skin=arcade] .tag{box-shadow:none;border-width:2px}
.mode:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.stat .pix{margin-right:2px;--pa:#ff8a00}
.stat .pix.gold{color:var(--gold)}
.stat:first-of-type .pix{color:#e8352a}

/* ---------- Fenêtres de fin : compactes, sans défilement ---------- */
.res.compact .bigstars{font-size:38px;gap:6px;margin:0 0 2px}
.res.compact .bigstars i:nth-child(2){font-size:46px;margin-top:-6px}
.resline{display:flex;align-items:center;justify-content:center;gap:10px}
.res.compact .pct{font-size:30px;margin:0}
.res.compact .newrec{margin:0}
.resmsg{font:700 14.5px/1.3 var(--sans);margin:4px 0 0}
.res .chips4{margin:10px 0 8px;gap:6px}
.res .chips4 div{padding:5px 2px;font-size:11px}
.res .chips4 div b{font-size:16px}
.res .xpgain{margin:0 0 8px;font-size:12.5px}
.sgrid{display:grid;gap:6px}
.sgrid .btn{padding:9px 4px;font-size:12px;white-space:normal;line-height:1.15}
.sbtns{gap:8px}
.sbox{max-height:92%}

/* ---------- Pas de défilement horizontal ---------- */
html,body,#home,main#tabBody{overflow-x:hidden}
.topbar{gap:6px;padding-left:12px;padding-right:12px}
.topbar h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{flex-shrink:0}
@media (max-width:420px){#stLvl .rk{display:none}#stLvl{padding-right:3px}}
.stage-hero{grid-template-columns:1fr minmax(0,60%);padding-right:6px}
.kit{max-width:100%}
.path{overflow:hidden}

/* ---------- Décor pixelisé ---------- */
img.px{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.frames{position:relative;display:block}
.frames img.f2{position:absolute;inset:0;visibility:hidden;animation:frB .5s steps(1,end) infinite}
.frames img.f1{animation:frA .5s steps(1,end) infinite}
@keyframes frA{0%{visibility:visible}50%{visibility:hidden}}
@keyframes frB{0%{visibility:hidden}50%{visibility:visible}}
.frames.kitpx img{animation-duration:.44s}
.deco img.px,.deco .frames{width:100%}
.wdeco{width:clamp(56px,22vw,80px);height:auto}
.frames.wdeco{width:clamp(56px,22vw,80px)}
.kitpx{width:100%;position:relative}
.here-stx .frames{width:100%}
.here-stx .frames img{animation-duration:.6s}
@media (prefers-reduced-motion:reduce){.frames img.f1{visibility:visible}.frames img.f2{visibility:hidden}}

/* ---------- Barre de menu du bas : un vrai « panneau de commande » d'arcade ---------- */
:root{--navpanel:#1d1730;--navkey:#fff4d6;--navink:#1d1730;--navmuted:#6b6380}
:root[data-dark]{--navpanel:#0a0816;--navkey:#2c2460;--navink:#f6f2ff;--navmuted:#b3abdc}
[data-skin=arcade] nav.nav{background:var(--navpanel);border-top:4px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));position:relative}
[data-skin=arcade] nav.nav::before{content:'MENU';position:absolute;left:50%;top:-12px;transform:translateX(-50%);font:400 8px/1 var(--display);letter-spacing:.2em;color:#fff;background:var(--navpanel);padding:4px 10px;border:3px solid var(--line);border-bottom:0}
[data-skin=arcade] nav.nav .in{gap:8px}
[data-skin=arcade] nav.nav button{flex:1;min-width:0;background:var(--navkey);color:var(--navink);border:3px solid #000;box-shadow:0 5px 0 #000;padding:7px 2px 6px;margin-bottom:5px;gap:3px;font:700 10.5px var(--sans);text-transform:uppercase;letter-spacing:.03em;transition:transform .06s,box-shadow .06s}
[data-skin=arcade] nav.nav button .ic{--pa:var(--accent);color:var(--navink)}
[data-skin=arcade] nav.nav button.on{background:var(--accent);color:var(--accent-ink);transform:translateY(4px);box-shadow:0 1px 0 #000}
[data-skin=arcade] nav.nav button.on .ic{color:var(--accent-ink);--pa:var(--accent-ink)}
[data-skin=arcade] nav.nav button:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.topbar h1{display:flex;align-items:center;gap:8px}
.topbar h1 .pix{flex-shrink:0;--pa:var(--accent)}

/* ---------- Boutons à texte long : retour à la ligne au lieu de déborder ---------- */
.btn.big,.sbox .btn,.polytog,.daily{white-space:normal;overflow-wrap:anywhere}
.btn.big{line-height:1.25}
.sgrid{grid-template-columns:repeat(var(--n,4),minmax(0,1fr))}
.sgrid .btn{overflow-wrap:normal;word-break:normal;hyphens:none}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:9px 2px 7px;background:var(--surface);color:var(--ink);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);border-radius:0;--pa:var(--accent);min-width:0}
.tbtn span{font:700 12px/1.1 var(--sans);white-space:nowrap}
.tbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.sgrid{gap:8px}
@media (max-width:359px){.sgrid{grid-template-columns:repeat(var(--n,4),minmax(0,1fr))!important}.tbtn span{font-size:10.5px}}
.bsub{display:block;font:600 12.5px/1.25 var(--sans);text-transform:none;letter-spacing:0;opacity:.92;margin-top:3px}

/* ---------- Choix de mode (vrais boutons) vs encadrés d'information ---------- */
[data-skin=arcade] :is(.panel,.qhead,.qkind){border:2px dashed color-mix(in srgb,var(--line) 55%,transparent);box-shadow:none;background:color-mix(in srgb,var(--surface) 65%,transparent)}
[data-skin=arcade] .qkind small,[data-skin=arcade] .panel .rule{opacity:.92}
.modes{margin-top:0}
[data-skin=arcade] .mode{position:relative;border:4px solid var(--line);box-shadow:6px 6px 0 var(--line);padding:18px 8px 14px;cursor:pointer}
[data-skin=arcade] .mode:not(.on){background:var(--surface)}
[data-skin=arcade] .mode:not(.on):hover{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
[data-skin=arcade] .mode.on{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--line)}
.mode .radio{position:absolute;top:8px;left:8px;width:20px;height:20px;border:3px solid currentColor;background:var(--surface);display:grid;place-items:center}
.mode.on .radio{background:var(--accent-ink)}
.mode.on .radio::after{content:'';width:8px;height:8px;background:var(--accent)}
.mode b{font-size:13px}

/* ---------- Bouton Réglages (Profil) ---------- */
.gearbtn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);color:var(--ink);padding:10px 14px;margin:8px 0 4px;border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);--pa:var(--accent)}
.gearbtn b{display:block;font:400 12px/1.5 var(--display);text-transform:uppercase}
.gearbtn small{display:block;font:600 12.5px var(--sans);color:var(--muted)}
.gearbtn .chev{font:400 18px var(--display);color:var(--accent)}
.gearbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
#settings .gbody{overflow-y:auto}

/* ---------- Choix de la langue ---------- */
#langPick{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#langPick .lpbox{width:100%;max-width:340px;display:grid;gap:14px;text-align:center;background:var(--surface);border:4px solid var(--line);box-shadow:6px 6px 0 var(--line);padding:22px 18px}
#langPick .lpt{font:400 20px/1.3 var(--display);color:var(--accent)}
#langPick p{margin:0;font:700 15px/1.5 var(--sans)}
#langPick p span{color:var(--muted);font-weight:600}
#langSeg{grid-column:1/3}

/* ---------- Succès ---------- */
.acat{font:400 11px/1.5 var(--display);text-transform:uppercase;margin:16px 2px 8px;display:flex;justify-content:space-between;color:var(--ink)}
.acat span{font:700 13px var(--sans);color:var(--muted)}
.badge i{font-style:italic;color:var(--muted)}
.badge.secret .e{filter:none;opacity:.5}
.abar{display:block;height:6px;background:var(--surface2);margin:6px 4px 2px;border:1.5px solid var(--line)}
.abar i{display:block;height:100%;background:var(--good)}
.badge small{display:block;font:700 11px var(--sans);color:var(--muted)}

/* ---------- Validations (3 réussites par étape) ---------- */
.vpips{display:inline-flex;gap:3px;vertical-align:-1px}
.vpips i{display:block;width:16px;height:8px;border:2px solid var(--good);background:transparent}
.vpips i.on{background:var(--good)}
.vpips i.new{animation:vpop .6s cubic-bezier(.3,1.6,.5,1) .4s both}
@keyframes vpop{from{transform:scale(0)}}
.vline{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font:700 12.5px var(--sans);color:var(--good)}
.resval{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 0;font:700 13px/1.3 var(--sans);color:var(--good);text-align:left}
.resval .vpips i{width:20px;height:10px}

/* ---------- Garde-fous anti-débordement horizontal ---------- */
.sbox,.gbody,#modal .box,.col{overflow-x:hidden}
.sbox img,.sbox svg,.col img{max-width:100%}
.row>*{min-width:0}
#qBody .row .btn{white-space:normal;line-height:1.2}
#qBody{overflow-x:hidden}

/* ---------- Fond animé en tuiles ---------- */
#bgTiles{position:fixed;left:0;top:0;z-index:-2;image-rendering:pixelated;pointer-events:none}
#bgGrid{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.6;
  background-image:linear-gradient(var(--bg) 2px,transparent 2px),linear-gradient(90deg,var(--bg) 2px,transparent 2px);background-size:28px 28px}
.nlab b,.nlab{text-shadow:0 0 3px var(--bg),0 0 6px var(--bg)}

/* ---------- Pass, survie, paliers ---------- */
.passbar{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;font:700 12.5px var(--round);color:var(--muted)}
.passbar i{display:block;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.passbar i b{display:block;height:100%;background:var(--gold);border-radius:99px}
.stagew{display:grid;gap:4px}
.passb{justify-self:end;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.survgrid{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:30px 1fr auto 48px;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px;text-align:left;width:100%}
.srow.on{border-color:var(--dc);box-shadow:inset 0 0 0 1.5px var(--dc);background:color-mix(in srgb,var(--dc) 9%,var(--surface))}
.srow .sn{font:800 13.5px var(--round)}
.srow .sm i{font-style:normal;font-size:18px;filter:grayscale(1);opacity:.25;margin-left:2px}
.srow .sm i.on{filter:none;opacity:1}
.srow .st{font:800 14px var(--round);text-align:right;color:var(--muted)}
.medals{display:flex;justify-content:center;gap:10px;margin:10px 0 0}
.medals span{display:flex;flex-direction:column;align-items:center;font-size:30px;line-height:1.1;filter:grayscale(1);opacity:.3}
.medals span.on{filter:none;opacity:1}
.medals span.new{animation:star .5s cubic-bezier(.3,1.6,.5,1) both}
.medals small{font:700 11px var(--round);color:var(--muted)}
.qms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qms span{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:12px;color:var(--muted)}
.qms span b{display:block;font:800 15px var(--round);color:var(--ink)}
.qms span.on{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.qms span.on b::before{content:'✓ ';color:var(--good)}

/* ---------- Profil ---------- */
.me{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin:8px 0 12px}
.ring{--p:0;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center}
.ring div{width:62px;height:62px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 26px var(--round)}
.me h2{margin:0;font:800 20px var(--round)}
.me p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:11.5px;line-height:1.25;color:var(--muted)}
.badge .e{font-size:28px;display:block;margin-bottom:3px}
.badge b{display:block;font:800 12.5px var(--round);color:var(--ink)}
.badge.off .e{filter:grayscale(1);opacity:.35}
.badge.off b{color:var(--muted)}
.set{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:10px}
.set h3{font:800 14px var(--round);margin:12px 0 4px}
.sr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.sr:first-of-type{border-top:0}
.sr .lb{font-size:14px}
.sr .lb small{display:block;color:var(--muted);font-size:12px}
.sr .seg{grid-column:1/3}
.sr input[type=range]{grid-column:1/3;width:100%;accent-color:var(--accent)}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--surface2);position:relative;border:0;margin:0;cursor:pointer;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px)}

/* ---------- Écrans de jeu ---------- */
.screen{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);display:none;flex-direction:column;z-index:5}
.screen.on{display:flex}
.ghead{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;max-width:760px;width:100%;margin:0 auto}
.ghead .t{flex:1;min-width:0}
.ghead .t b{display:block;font:800 16px/1.2 var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead .t span{font-size:12.5px;color:var(--muted)}
.hud{display:flex;align-items:center;gap:10px;padding:2px 14px 8px;max-width:760px;width:100%;margin:0 auto;flex-wrap:wrap}
.hud .sc{font:800 26px/1 var(--round);font-variant-numeric:tabular-nums}
.hud .cb{font:800 14px var(--round);color:var(--muted)}
.hud .cb.hot{color:var(--accent)}
.hud .sp{flex:1}
.tempo{font:700 13.5px var(--serif);color:var(--muted)}
.gbody{flex:1;min-height:0;overflow:auto;max-width:760px;width:100%;margin:0 auto;padding:0 12px;position:relative}
.scorebox{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:10px 8px;position:relative;min-height:120px}
.pcount{position:absolute;right:14px;top:4px;font:800 54px/1 var(--round);color:var(--accent);opacity:0;pointer-events:none}
.pcount.on{opacity:1}
.gfoot{padding:8px 12px 12px;max-width:760px;width:100%;margin:0 auto;position:relative}
.pad{width:100%;height:clamp(104px,19vh,150px);border:0;border-radius:24px;background:var(--accent);color:var(--accent-ink);font:800 21px var(--round);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000);transition:transform .05s,box-shadow .05s}
.pad small{font:600 13px var(--sans);opacity:.85}
.pad.hit{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.pad[data-j=ok]{background:var(--good)}
.pad[data-j=approx]{background:var(--warn)}
.pad[data-j=miss]{background:var(--bad)}
.judge{position:absolute;left:0;right:0;top:-34px;text-align:center;font:800 24px var(--round);pointer-events:none;opacity:0}
.judge.go{animation:pop .55s ease-out}
.judge.ok{color:var(--good)}.judge.approx{color:var(--warn)}.judge.miss{color:var(--bad)}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.tools{display:flex;gap:8px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}

/* Sans fin */
#endless{background:color-mix(in srgb,var(--tint) 13%,var(--bg));transition:background 1.4s}
.hp{flex-basis:100%;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.hp i{display:block;height:100%;width:100%;border-radius:99px;background:var(--good);transition:width .2s,background .3s}
.strip{position:relative;background:var(--surface);border-radius:20px;margin:6px 12px 0;border:2px solid color-mix(in srgb,var(--tint) 45%,var(--line));transition:border-color 1.4s;overflow:hidden}
#eSvg{display:block;width:100%;height:clamp(120px,19vh,210px);color:var(--ink)}
.playhead{stroke:var(--tint);stroke-width:2.6;stroke-linecap:round;transition:stroke 1.4s}
.tso{font:700 14px var(--serif);fill:currentColor;text-anchor:middle}
.cnum{font:800 30px var(--round);fill:var(--muted);text-anchor:middle}
.clab{font:700 12px var(--sans);fill:var(--muted)}
.banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;text-align:center;padding:0 16px}
.banner b{font:800 34px/1.05 var(--round);color:var(--tint);text-shadow:0 2px 0 var(--surface)}
.banner span{font:700 14px var(--round);color:var(--ink);background:var(--surface);border-radius:99px;padding:3px 12px;margin-top:6px}
.banner.go{animation:ban 2.1s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.04)}20%{transform:scale(1)}78%{opacity:1}100%{opacity:0}}
.emid{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:900px;width:100%;margin:0 auto}
.edesc{text-align:center;font-size:13.5px;color:var(--muted);margin:8px 16px 0;min-height:20px}

/* Quiz */
.qbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;flex-basis:100%}
.qbar i{display:block;height:100%;background:var(--accent);width:100%}
.qbar i.low{background:var(--bad)}
.hearts{font-size:17px;letter-spacing:1px}
.qprompt{font:800 18px/1.25 var(--round);margin:4px 2px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.listen{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:10px;width:100%;text-align:left}
.listen .pl{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.listen b{font:800 16px var(--round);display:block}
.listen>span:last-child>span{display:block;font-size:12.5px;color:var(--muted)}
.qopt{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 10px 8px 8px;margin-bottom:8px;width:100%;text-align:left}
.qopt .ql{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:800 15px var(--round);color:var(--muted)}
.qopt svg{display:block;width:100%;height:auto;color:var(--ink)}
.qopt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.qopt.sel .ql{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qopt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.qopt.good .ql{background:var(--good);border-color:var(--good);color:#fff}
.qopt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.qopt.bad .ql{background:var(--bad);border-color:var(--bad);color:#fff}
.qopt .qp{grid-column:2;justify-self:start}
.mbox{fill:transparent;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4;cursor:pointer}
.mg.sel .mbox{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:var(--accent);stroke-dasharray:none}
.mg.good .mbox{fill:color-mix(in srgb,var(--good) 16%,transparent);stroke:var(--good);stroke-dasharray:none}
.mg.bad .mbox{fill:color-mix(in srgb,var(--bad) 14%,transparent);stroke:var(--bad);stroke-dasharray:none}
.mg.missed .mbox{stroke:var(--bad);stroke-width:2.5;stroke-dasharray:6 3}
.mck{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.mg.sel .mck{fill:var(--accent);stroke:var(--accent)}
.mcm{font:800 11px var(--sans);fill:#fff;text-anchor:middle;display:none}
.mg.sel .mcm,.mg.good .mcm,.mg.bad .mcm{display:block}
.mg.good .mck{fill:var(--good);stroke:var(--good)}.mg.bad .mck{fill:var(--bad);stroke:var(--bad)}
.mg{cursor:pointer}
.qfb{border-radius:14px;padding:10px 12px;margin:4px 0 10px;font:700 14.5px var(--round)}
.qfb.good{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.qfb.bad{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--bad)}

/* ---------- Notation ---------- */
.sys{display:block;width:100%;height:auto;overflow:visible;color:var(--ink)}
.staff{stroke:currentColor;stroke-width:1.1}
.bar{stroke:currentColor;stroke-width:1.3}
.fill,.beam{fill:currentColor}
.stem{stroke:currentColor;stroke-width:1.25}
.rs{stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round}
.hole{fill:var(--card)}
.ts{font:700 20px var(--serif);fill:currentColor;text-anchor:middle}
.grp{font:italic 11px var(--serif);fill:var(--muted);text-anchor:middle}
.tup{font:italic 700 11.5px var(--serif);fill:currentColor;text-anchor:middle}
.brk{stroke:currentColor;stroke-width:1;fill:none}
.tie{fill:currentColor}
.bn{font:600 11px var(--sans);fill:var(--muted);text-anchor:middle}
.mnum{font:italic 10.5px var(--serif);fill:var(--muted)}
g.ev{color:var(--ink)}
g.ev.on{color:var(--accent)}
g.ev.ok{color:var(--good)} g.ev.approx{color:var(--warn)} g.ev.miss{color:var(--bad)}
.cursor{stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;opacity:.85}
.tm{stroke-width:2.2;stroke-linecap:round}
.tm.ok{stroke:var(--good)} .tm.approx{stroke:var(--warn)} .tm.extra{stroke:var(--bad)}
.snip{display:inline-flex;flex-direction:column;align-items:center;background:var(--surface2);border-radius:10px;padding:2px 8px 4px;margin:0 6px 6px 0}
.snip svg{height:44px;width:auto;color:var(--ink)}
.snip span{font-size:10.5px;color:var(--muted);max-width:100px;text-align:center;line-height:1.15}

/* ---------- Feuilles (bottom sheets) ---------- */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(14,10,40,.5);display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:600px){#sheet{align-items:center}.sbox{border-radius:24px;padding-bottom:18px}}
.sbox h2{font:800 21px/1.2 var(--round);margin:0 0 4px}
.sbox .lead{color:var(--muted);margin:0 0 10px}
.stages{display:grid;gap:8px;margin:12px 0 4px}

<script>
'use strict';
/* =========================================================
   1. VALEURS RYTHMIQUES — noire = 120 unités
   ========================================================= */
const BASE={b:960,w:480,h:240,q:120,e:60,s:30,t:15,x:7.5};
const BEAMS={e:1,s:2,t:3,x:4};
const TYPES=['x','t','s','e','q','h','w','b'];
function shiftType(t,sh){if(!sh)return t;const i=TYPES.indexOf(t)+sh;return i>=0&&i<TYPES.length?TYPES[i]:null;}
const TUP={2:3/2,3:2/3,4:3/4,5:4/5,6:2/3,7:4/7,9:8/9,10:4/5,11:8/11,12:2/3};
const FAMT={S:120,C:180,H:240};
const UP={t:'s',s:'e',e:'q',q:'h',h:'w'};

function parseCode(code){
  const re=/(\d+)\(|\)|(r?)([whqestxb])(\.{0,2})/g; const out=[]; let m, tup=null;
  while((m=re.exec(code))){
    if(m[1]){tup={num:+m[1],ratio:TUP[m[1]],mem:[],raw:0};continue;}
    if(m[0]===')'){const tot=Math.round(tup.raw),sum=tup.mem.reduce((a,k)=>a+out[k].ticks,0);out[tup.mem[tup.mem.length-1]].ticks+=tot-sum;tup.mem.forEach((k,j,a)=>{out[k].tup=tup.num;out[k].tf=j===0;out[k].tl=j===a.length-1;});tup=null;continue;}
    const type=m[3], dots=m[4].length, rest=m[2]==='r';
    let ticks=BASE[type]*(dots===1?1.5:dots===2?1.75:1);
    if(tup){ticks*=tup.ratio;tup.raw+=ticks;tup.mem.push(out.length);}
    out.push({type,dots,rest,ticks:Math.round(ticks)});
  }
  return out;
}

/* Cellules : [id, famille (S simple / C composée), code, nom, options] */
const CELL_DEFS=[

 ['rq','S','rq','Soupir'],

 ['trip_eq','S','3(e q)','Triolet croche, noire'],

 // — Compléments : triples croches —
 ['ss_tttt','S','s s t t t t','Deux doubles, quatre triples'],
 ['tttt_ss','S','t t t t s s','Quatre triples, deux doubles'],
 ['s_tt_e','S','s t t e','Double, deux triples, croche'],

 ['s_tt_ss','S','s t t s s','Double, deux triples, deux doubles'],

 ['sd_t_x2','S','s. t s. t','Doubles pointées, triples'],
 ['t_sd_x2','S','t s. t s.','Triples, doubles pointées'],

 ['e_rt_ttt','S','e rt t t t','Croche, huitième de soupir, trois triples'],
 ['rs_tt_e','S','rs t t e','Quart de soupir, deux triples, croche'],
 ['s_rt_t_e','S','s rt t e','Double, huitième de soupir, triple, croche'],
 ['tt_rs_e','S','t t rs e','Deux triples, quart de soupir, croche'],
 // — Compléments : n-olets —
 ['quint_es','S','5(e s s s)','Quintolet : croche, trois doubles'],

 ['sext_r','S','6(s s rs s s s)','Sextolet avec silence'],

 ['non','S','9(t t t t t t t t t)','Nonolet'],
 ['non_s','S','9(s t t t t t t t)','Nonolet : double, sept triples'],
 ['dix','S','10(t t t t t t t t t t)','Dixolet'],
 ['onze','S','11(t t t t t t t t t t t)','Onzolet'],
 ['sext12','S','12(t t t t t t t t t t t t)','Double sextolet'],
 ['quint2','S','5(e e e e e)','Quintolet de croches (2 temps)'],
 ['sext2','S','6(e e e e e e)','Sextolet de croches (2 temps)'],
 ['sept2','S','7(e e e e e e e)','Septolet de croches (2 temps)'],
 ['h','S','h','Blanche'],
 ['rh','S','rh','Demi-pause'],
 ['qd_e','S','q. e','Noire pointée, croche'],
 ['e_qd','S','e q.','Croche, noire pointée'],

 ['tripq','S','3(q q q)','Triolet de noires'],
 ['hd','S','h.','Blanche pointée'],
 ['w','S','w','Ronde'],
 ['rw','S','rw','Pause'],
 ['c_qd','C','q.','Noire pointée'],
 ['c_rqd','C','rq.','Soupir pointé'],
 ['c_q_e','C','q e','Noire, croche'],
 ['c_e_q','C','e q','Croche, noire'],
 ['c_eee','C','e e e','Trois croches'],
 ['c_rq_e','C','rq e','Soupir, croche'],
 ['c_q_re','C','q re','Noire, demi-soupir'],
 ['c_e_re_e','C','e re e','Croche, demi-soupir, croche'],
 ['c_re_e_e','C','re e e','Demi-soupir, deux croches'],
 ['c_e_e_re','C','e e re','Deux croches, demi-soupir'],
 ['c_sicil','C','e. s e','Rythme sicilien'],
 ['c_ss_e_e','C','s s e e','Deux doubles, deux croches'],
 ['c_e_ss_e','C','e s s e','Croche, deux doubles, croche'],
 ['c_e_e_ss','C','e e s s','Deux croches, deux doubles'],
 ['c_q_ss','C','q s s','Noire, deux doubles'],
 ['c_ss_q','C','s s q','Deux doubles, noire'],
 ['c_ssss_e','C','s s s s e','Quatre doubles, croche'],
 ['c_e_ssss','C','e s s s s','Croche, quatre doubles'],
 ['c_s6','C','s s s s s s','Six doubles'],
 ['c_duo','C','2(e e)','Duolet'],
 ['c_quarto','C','4(e e e e)','Quartolet'],
 ['c_hd','C','h.','Blanche pointée'],
 ['c_rhd','C','rh.','Demi-pause pointée'],
 ['c_wd','C','w.','Ronde pointée'],
];
const CELLS={}, CELL_LIST=[];
CELL_DEFS.forEach(([id,fam,code,name,fl])=>{
  const ev=parseCode(code); const ticks=ev.reduce((a,e)=>a+e.ticks,0);
  const c={id,fam,code,name,ev,ticks,beats:ticks/FAMT[fam],sync:!!(fl&&fl.sync),
    hasRest:ev.some(e=>e.rest),allRest:ev.every(e=>e.rest),long:ev.length===1&&!ev[0].rest,
    hOk:fam==='S'&&!ev.some(e=>e.type==='w')};
  if(!Number.isInteger(c.beats)) console.warn('cellule mal formée',id);
  CELLS[id]=c; CELL_LIST.push(c);
});

/* ---------- Variantes de cellules (silences, notes regroupées) ---------- */
const VTOK=/\d+\(|\)|r?[whqestxb]\.{0,2}/g;
const isNoteTok=t=>!/[()]/.test(t);
const tokCode=tk=>tk.join(' ').replace(/\( /g,'(').replace(/ \)/g,')');
const sqz=c=>c.replace(/\s/g,'');
function normRests(tk){
  for(let guard=0;guard<20;guard++){
    let depth=0,hit=false;
    for(let i=0;i<tk.length-1;i++){
      const t=tk[i];if(/\($/.test(t)){depth++;continue;}if(t===')'){depth--;continue;}
      if(depth||t[0]!=='r'||t.includes('.')||tk[i+1]!==t)continue;
      const ty=t.slice(1),up=UP[ty];if(!up)continue;
      const tick=parseCode(tokCode(tk.slice(0,i))).reduce((a,e)=>a+e.ticks,0);
      if(tick%(BASE[ty]*2))continue;
      tk.splice(i,2,'r'+up);hit=true;break;
    }
    if(!hit)return tk;
  }
  return tk;
}
function makeCell(id,fam,code,name){
  const ev=parseCode(code); const ticks=ev.reduce((a,e)=>a+e.ticks,0);

  const out=[],E=ex.events;
  for(let i=0;i<E.length;i++){
    const e=E[i];if(e.rest||e.filler)continue;if(i>0&&E[i-1].tie&&!E[i-1].rest)continue;
    const mt=tl.meas[e.mi];let d=e.ticks*mt.spt,j=i;
    while(E[j].tie&&E[j+1]){j++;d+=E[j].ticks*tl.meas[E[j].mi].spt;}
    out.push({gi:i,t:mt.start+e.tick*mt.spt,d});

}

let AC=null,master=null;
function audio(){
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function heardNow(){
  if(!AC)return 0;
  if(AC.getOutputTimestamp){try{const ts=AC.getOutputTimestamp();if(ts.contextTime>0&&ts.performanceTime>0)return ts.contextTime+(performance.now()-ts.performanceTime)/1000;}catch(e){}}
  return AC.currentTime-(AC.outputLatency||AC.baseLatency||0);
}
function envG(g,t,peak,decay){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+0.003);g.gain.exponentialRampToValueAtTime(0.0001,t+decay);}
function click(bus,t,lvl){
  const v=G.set.volM/100*(lvl===2?0.9:lvl===1?0.6:0.28);if(v<0.002)return;
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=lvl===2?1760:lvl===1?1245:900;
  envG(g,t,v,0.05);o.connect(g);g.connect(bus);o.start(t);o.stop(t+0.07);
}
/* low=true : même instrument, plus grave (voix 2 de la polyrythmie) */
function hit(bus,t,d,low){
  const v=G.set.volR/100;if(v<0.002)return;const k=G.set.timbre;
  const g=AC.createGain();g.connect(bus);
  if(k==='tenu'){
    const p=low?2/3:1;  // une quinte plus bas
    const o=AC.createOscillator(),o2=AC.createOscillator(),g2=AC.createGain();
    o.type='triangle';o.frequency.value=587.33*p;o2.type='sine';o2.frequency.value=1174.66*p;g2.gain.value=0.18;
    o.connect(g);o2.connect(g2);g2.connect(g);
    const end=t+Math.max(0.07,d*0.9),hold=Math.max(t+0.08,end-0.03),vv=low?v*1.15:v;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vv*0.55,t+0.006);g.gain.exponentialRampToValueAtTime(vv*0.3,t+0.08);
    g.gain.setValueAtTime(vv*0.3,hold);g.gain.exponentialRampToValueAtTime(0.0001,Math.max(hold+0.03,end+0.04));
    o.start(t);o2.start(t);o.stop(end+0.1);o2.stop(end+0.1);
  }else if(k==='bois'){
    const p=low?0.6:1;  // wood-block grave
    const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(1000*p,t);o.frequency.exponentialRampToValueAtTime(760*p,t+0.05);
    envG(g,t,v*(low?1:0.9),low?0.12:0.09);o.connect(g);o.start(t);o.stop(t+0.15);
  }else if(k==='tambour'){
    const p=low?0.7:1;  // fût plus grave (reste audible sur un haut-parleur de téléphone)
    const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(180*p,t);o.frequency.exponentialRampToValueAtTime(55*p,t+0.15);
    envG(g,t,v*(low?1.15:1),0.3);o.connect(g);o.start(t);o.stop(t+0.33);
  }else{
    const o=AC.createOscillator();o.type='sine';o.frequency.value=low?1500:2500;envG(g,t,v*0.7,0.06);o.connect(g);o.start(t);o.stop(t+0.08);
  }
}

function exSig(ex){return ex.events.filter(e=>!e.rest).map(e=>ex.measures[e.mi].start+e.tick).join(',');}
function exCells(ex){return ex.measures.map((mm,mi)=>{const out=[];let pos=0,cur=null;const m=METERS[mm.meter],f=0;
  mm.events.forEach(e=>{if(!cur){cur={c:CELLS[e.cell],pos};}if(e.cellEnd){out.push(cur);pos+=cur.c?cur.c.beats:1;cur=null;}});return{meter:mm.meter,cells:out};});}
function exFromCells(seq){const ms=seq.map(s=>{const m=METERS[s.meter],evs=[];let t=0;s.cells.forEach(x=>{instCell(x.c,m.beats[x.pos],m.sh).forEach(e=>{e.tick=t;t+=e.ticks;evs.push(e);});});return{meter:s.meter,events:evs};});return finishExercise(ms);}
function sigDist(a,b){const A=new Set(a.split(',')),B=new Set(b.split(','));let d=0;A.forEach(x=>{if(!B.has(x))d++;});B.forEach(x=>{if(!A.has(x))d++;});return d;}
function buildQuiz(cfg,rng,p){
  for(let tries=0;tries<40;tries++){
    const base=genExercise(p,1000+Math.floor(rng()*8999));if(!base)return null;
    const bs=exSig(base);if(bs.split(',').filter(Boolean).length<2)continue;
    const seq=exCells(base);if(seq.some(s=>s.cells.some(x=>!x.c)))continue;
    const slots=[];seq.forEach((s,mi)=>s.cells.forEach((x,k)=>slots.push({mi,k})));
    const poolC=p.pool.map(x=>x.c).filter(Boolean);
    const opts=[{ex:base,sig:bs}],seen=new Set([bs]);
    const maxD=[0,3,5,99][cfg.sim];
    for(let a=0;a<600&&opts.length<cfg.n;a++){
      const nChange=cfg.sim===3&&rng()<0.5?2:1,nseq=seq.map(s=>({meter:s.meter,cells:s.cells.slice()}));
      for(let q=0;q<nChange;q++){
        const sl=slots[Math.floor(rng()*slots.length)],x=nseq[sl.mi].cells[sl.k],m=METERS[nseq[sl.mi].meter];
        const root=x.c.variant?CELLS[x.c.variant]:x.c,v=cellVariants(root);
        let cands=poolC.filter(c=>c.beats===x.c.beats&&c.id!==x.c.id&&placeable(c,m,x.pos));
        if(v&&rng()<0.6){const vs=[root,...v.one,...v.merge,...(cfg.sim>1?v.two:[])].map(o=>o.id?CELLS[o.id]:o).filter(c=>c&&c.id!==x.c.id&&placeable(c,m,x.pos));if(vs.length)cands=vs;}
        if(!cands.length)continue;
        nseq[sl.mi].cells[sl.k]={c:cands[Math.floor(rng()*cands.length)],pos:x.pos};
      }
      const ex=exFromCells(nseq),sg=exSig(ex);
      if(seen.has(sg)||!sg)continue;
      const d=sigDist(bs,sg);if(d>maxD+Math.floor(a/150))continue;
      if(opts.some(o=>sigDist(o.sig,sg)<1))continue;
      seen.add(sg);opts.push({ex,sig:sg});
    }
    if(opts.length<cfg.n)continue;
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    const answer=Math.floor(rng()*opts.length);
    return{options:opts.map(o=>o.ex),answer};
  }
  return null;
}

}

  let surv=0;Object.keys(G.surv.med||{}).forEach(k=>{const[d,i]=k.split('-').map(Number);if(SURV[i])surv+=d*SURV[i][1];});
  let qz=0;QUIZ_MS.forEach(([s,x])=>{if((G.quiz.best||0)>=s)qz+=x;});
  let poly=0;LEVELS.forEach((L,li)=>{if((G.best[li+'-p']||0)>=85)poly+=30*LVL_D[li][1];});
  for(let d=1;d<=(G.endlessP.done||0);d++)poly+=50*d;
  Object.keys(G.survP.med||{}).forEach(k=>{const[d,i]=k.split('-').map(Number);if(SURV[i])poly+=d*SURV[i][1];});

}

/* =========================================================
   POLYRYTHMIE — deux lignes simultanées
   Ligne du haut (A) : bouton droit · Ligne du bas (B) : bouton gauche
   ========================================================= */
const PDY=74;               // décalage vertical de la portée du bas

/* Niveau « compagnon » pour la main gauche : plus simple que la ligne du haut, compatible avec ses mesures */
const POLY_COMP={};
function polyCompanion(li){
  if(li in POLY_COMP)return POLY_COMP[li];
  const d=LVL_D[li][0],target=d<=3?1:d<=6?d-2:d-1,meters=LEVELS[li].m;let best=-1;
  for(let k=0;k<=li;k++){if(LVL_D[k][0]>target)continue;const pool=levelCells(k).map(id=>({c:CELLS[id],w:1})).filter(x=>x.c);
    if(meters.every(mk=>METERS[mk]&&canFill(METERS[mk],pool)))best=k;}
  return POLY_COMP[li]=best;
}
const PULSE_POOL=Object.values(CELLS).filter(c=>c.ev&&c.ev.length===1&&!c.ev[0].rest&&c.beats<=2).map(c=>({c,w:c.beats===1?3:1}));
const mSig=m=>m.events.filter(e=>!e.rest).map(e=>e.tick).join(',');
function genLineB(A,li,seed){
  const lc=polyCompanion(li),seq=A.measures.map(m=>m.meter),sigA=exSig(A);
  const base=lc>=0?Object.assign({},levelParams(lc,0,seq.length),{tie:0,change:false}):{pool:PULSE_POOL,measures:seq.length,tie:0,rest:0.1,endLong:true};
  const tries=[base,{pool:PULSE_POOL,measures:seq.length,tie:0,rest:0.1,endLong:true}];
  for(const p0 of tries){const p=Object.assign({},p0,{meterSeq:seq,measures:seq.length});
    for(let k=0;k<18;k++){const B=genExercise(p,(seed+k*101)%9000+1000);if(!B||exSig(B)===sigA)continue;
      const same=A.measures.filter((m,i)=>mSig(m)===mSig(B.measures[i])).length;if(same<=Math.floor(seq.length/2))return B;}}
  return null;
}
function polyDiff(A,B,bpm){return clamp(videoDifficulty(A,bpm).level+Math.ceil(videoDifficulty(B,bpm).level/3),1,10);}
function genPoly(li,seed,nM){
  const p=Object.assign({},levelParams(li,0,nM||4));
  for(let k=0;k<10;k++){const s=(seed+k*37)%9000+1000,A=genExercise(p,s);if(!A)continue;const B=genLineB(A,li,s+7);if(B)return{A,B,seed:s};}
  return null;
}

/* Mise en page alignée : les deux lignes partagent la même grille temporelle */
function layoutPoly(A,B,W){
  const items=A.measures.map((mm,i)=>{const mb=B.measures[i],meter=METERS[mm.meter],ts=i===0||mm.meter!==A.measures[i-1].meter,ut=unitTicks(meter);
    const ticks=[...new Set([...mm.events.map(e=>e.tick),...mb.events.map(e=>e.tick)])].sort((a,b)=>a-b);
    const ws=ticks.map((t,k)=>{const g=(k<ticks.length-1?ticks[k+1]:meter.ticks)-t;let x=0;
      [mm.events,mb.events].forEach(E=>E.forEach(e=>{if(Math.abs(e.tick-t)<0.01){if(e.dots)x=Math.max(x,6*e.dots);if(e.type==='b')x=Math.max(x,6);}}));
      return 15+24*Math.sqrt(g/ut)+x;});
    const fixed=12+(ts?34:0)+8,varw=ws.reduce((a,b)=>a+b,0);
    return{mm,mb,i,meter,beats:meter.beats,ts,ticks,ws,fixed,varw,nat:fixed+varw};});
  const lines=[];let cur=[],sum=PLBL;
  items.forEach(it=>{if(cur.length&&sum+it.nat>W){lines.push(cur);cur=[];sum=PLBL;}cur.push(it);sum+=it.nat;});
  if(cur.length)lines.push(cur);
  return lines.map((line,li)=>{
    const fixed=line.reduce((a,b)=>a+b.fixed,0)+PLBL,varw=line.reduce((a,b)=>a+b.varw,0);
    let k=(W-fixed)/varw;if(li===lines.length-1)k=Math.min(k,1.45);
    let x=PLBL;
    const ms=line.map(it=>{const x0=x;let cx=x0+12+(it.ts?34:0);const grid=it.ticks.map((t,j)=>{const o={t,x:cx+7};cx+=it.ws[j]*k;return o;});
      const gx=t=>{for(const g of grid)if(Math.abs(g.t-t)<0.01)return g.x;return grid[0].x;};
      const x1=cx+8;x=x1;
      return{...it,x0,x1,grid,evsA:it.mm.events.map(ev=>({ev,x:gx(ev.tick)})),evsB:it.mb.events.map(ev=>({ev,x:gx(ev.tick)})),evs:[]};});
    return{ms,width:x};
  });

function xAtPoly(ms,tick){
  const G2=ms.grid;let o=0;for(let j=0;j<G2.length;j++)if(G2[j].t<=tick+0.01)o=j;
  const a=G2[o],nt=o+1<G2.length?G2[o+1].t:ms.meter.ticks,nx=o+1<G2.length?G2[o+1].x:ms.x1-5;
  return a.x+Math.max(0,Math.min(1,(tick-a.t)/Math.max(1,nt-a.t)))*(nx-a.x);
}
function drawPolySystems(lines,A,B){
  const nM=A.measures.length,pos={A:{},B:{}};
  lines.forEach((sys,si)=>sys.ms.forEach(ms=>{ms.evsA.forEach(o=>{pos.A[o.ev.gi]={si,x:o.x};});ms.evsB.forEach(o=>{pos.B[o.ev.gi]={si,x:o.x};});}));
  const ties=(ex,P,sys,si,key)=>{let s='';sys.ms.forEach(ms=>ms[key].forEach(o=>{const e=o.ev;if(!e.tie)return;const n=ex.events[e.gi+1];if(!n||!P[n.gi])return;
    const p2=P[n.gi];s+=p2.si===si?tieArc(o.x+3,p2.x-3):tieArc(o.x+3,sys.width+2);}));return s;};
  return lines.map((sys,si)=>{
    let a=`<line class="staff" x1="${PLBL-2}" y1="${LY}" x2="${f1(sys.width)}" y2="${LY}"/>`,b=`<line class="staff" x1="${PLBL-2}" y1="${LY}" x2="${f1(sys.width)}" y2="${LY}"/>`;
    if(sys.ms[0].i>0)a+=`<text class="mnum" x="${PLBL}" y="${LY-24}">${sys.ms[0].i+1}</text>`;
    sys.ms.forEach(ms=>{const last=ms.i===nM-1;a+=drawMeasure({...ms,evs:ms.evsA},{},last);b+=drawMeasure({...ms,evs:ms.evsB},{},last);});
    a+=ties(A,pos.A,sys,si,'evsA');b+=ties(B,pos.B,sys,si,'evsB');
    return`<line class="bar" x1="${PLBL-2}" y1="${LY-16}" x2="${PLBL-2}" y2="${LY+PDY+16}"/>
      <g class="lnA">${a}<text class="hand hD" x="5" y="${LY+4}">D</text><g class="tapmarks"></g></g>
      <g class="lnB" transform="translate(0 ${PDY})">${b}<text class="hand hG" x="5" y="${LY+4}">G</text><g class="tapmarks"></g></g>`;
  });
}

function schedulePlay(ex,bpm,hits){
  audio();const bus=AC.createGain();bus.connect(master);
  const tl=buildTimeline(ex,bpm),t0=AC.currentTime+0.2,m0=METERS[ex.measures[0].meter];
  const cnt=m0.beats.length<=2?2:1,md=tl.meas[0].dur,cb=[];

const TOL={indulgent:[0.07,0.14],normal:[0.045,0.095],strict:[0.03,0.06]};
const lat=()=>G.set.lat/1000;
function mkOnsets(ex,tl,base,extra){
  const on=onsets(ex,tl),[good,okw]=TOL[G.set.tol]||TOL.indulgent;
  return on.map((o,k)=>{const pg=k?o.t-on[k-1].t:1,ng=k<on.length-1?on[k+1].t-o.t:1,win=Math.min(okw,0.48*Math.min(pg,ng));
    return Object.assign({gi:o.gi,t:base+o.t,d:o.d,win,g:Math.min(good,win*0.62),st:null},extra||{});});
}
function judge(list,T,from,line){let best=null,bd=1e9;
  for(let i=from||0;i<list.length;i++){const o=list[i];if(o.t-T>0.3)break;if(o.st||(line&&o.line!==line))continue;const d=T-o.t;if(Math.abs(d)<=o.win&&Math.abs(d)<Math.abs(bd)){best=o;bd=d;}}
  if(!best)return null;best.st=Math.abs(bd)<=best.g?'ok':'approx';best.off=bd;return best;}
function sweep(list,now,cb,from){for(let i=from||0;i<list.length;i++){const o=list[i];if(o.t>now)break;if(!o.st&&now>o.t+o.win){o.st='miss';cb(o);}}}
const mult=c=>1+Math.min(3,Math.floor(c/8))*0.5;

  pad.dataset.j=st;clearTimeout(pad._j);pad._j=setTimeout(()=>{delete pad.dataset.j;},160);}

function runCursor(t){

/* Défilement anticipé : la ligne en cours est maintenue en haut de l'écran, les lignes suivantes restent visibles dessous. */
function runScrollTo(si){
  const s=RUN.rd.svgs[si],b=$('#play .gbody');if(!s||!b)return;
  const r=s.getBoundingClientRect(),br=b.getBoundingClientRect();
  RUN.scrollT=clamp(b.scrollTop+(r.top-br.top)-10,0,Math.max(0,b.scrollHeight-b.clientHeight));
  if(!RUN.scrollRaf)RUN.scrollRaf=requestAnimationFrame(runScrollStep);
}
function runScrollStep(){
  const b=$('#play .gbody');if(!RUN||RUN.scrollT==null){if(RUN)RUN.scrollRaf=0;return;}
  const d=RUN.scrollT-b.scrollTop;
  if(Math.abs(d)<1){b.scrollTop=RUN.scrollT;RUN.scrollRaf=0;return;}

const CAL={active:false,taps:[],clicks:[]};
function calibrate(){
  audio();const box=$('#modalBox');
  box.innerHTML=`<h2 style="font:800 19px var(--round);margin:0 0 6px">Calibration</h2><p>Tu vas entendre 16 clics. Tape en même temps que chacun, sur le bouton ou avec la barre d'espace.</p><button class="pad calpad" id="calPad">Tape ici</button><p class="muted" id="calMsg" style="margin-top:10px">Prépare-toi…</p><div class="row" style="justify-content:flex-end"><button class="btn small" id="calClose">Fermer</button></div>`;
  $('#modal').classList.remove('hidden');
  const bus=AC.createGain();bus.connect(master);const ibi=60/90,t0=AC.currentTime+0.8;CAL.clicks=[];CAL.taps=[];CAL.active=true;
  for(let k=0;k<16;k++){const t=t0+k*ibi;CAL.clicks.push(t);click(bus,t,k%4===0?2:1);}
  $('#calPad').addEventListener('pointerdown',e=>{e.preventDefault();CAL.taps.push(heardNow());padHit(e.currentTarget);});
  $('#calClose').onclick=()=>{CAL.active=false;killBus(bus);$('#modal').classList.add('hidden');};
  setTimeout(()=>{const m=$('#calMsg');if(m)m.textContent='C\'est parti, tape avec les clics…';},700);
  setTimeout(()=>{
    if(!CAL.active)return;CAL.active=false;const m=$('#calMsg');if(!m)return;
    const offs=[];CAL.taps.forEach(t=>{let b=null;CAL.clicks.forEach((c,i)=>{if(i<3)return;const d=t-c;if(Math.abs(d)<0.3&&(b===null||Math.abs(d)<Math.abs(b)))b=d;});if(b!==null)offs.push(b);});
    if(offs.length<6){m.textContent='Pas assez de frappes détectées. Ferme et recommence.';return;}
    offs.sort((a,b)=>a-b);const med=Math.round(offs[Math.floor(offs.length/2)]*1000);
    m.innerHTML=`Décalage mesuré : <b>${med>0?'+':''}${med} ms</b>. <button class="btn small primary" id="calApply">Appliquer</button>`;
    $('#calApply').onclick=()=>{G.set.lat=med;G.stats.calib=1;checkBadges();save();$('#modal').classList.add('hidden');toast(`Compensation de latence : ${med} ms`);renderSettings();};
  },(0.8+16*ibi+0.6)*1000);
}


/* =========================================================
   SANS FIN — les rythmes défilent jusqu'à l'échec
   ========================================================= */
let EN=null;
const EN_PAL=3;           // blocs de 2 mesures par palier
const EN_BAR=18;          // écart entre la barre de mesure et le premier temps
const EN_SLOPE=300;       // variation max de la vitesse de défilement (unités/s²) : les changements sont progressifs
const EN_VMIN=38;         // vitesse plancher (unités/s)
/* Défilement : chaque mesure reçoit la vitesse juste nécessaire à sa lecture (notes serrées → plus vite,
   notes longues → plus lent). La vitesse varie en douceur entre mesures, sans saut ni téléportation.
   La position d'une note correspond exactement à son instant de frappe. */
function measV(ex,mi,tl){
  const E=ex.measures[mi].events,mt=tl.meas[mi];let v=EN_VMIN;
  E.forEach((e,j)=>{const d=e.ticks*mt.spt,need=(j===E.length-1?EN_BAR+22:24)+6*(e.dots||0)+(e.tup?3:0);v=Math.max(v,need/d);});
  return Math.min(v,520);
}
function evSegs(ex,tl){
  /* Un segment par note ou silence : chaque valeur reçoit la place dont elle a besoin, la vitesse se lisse entre elles. */
  const out=[];ex.measures.forEach((mm,mi)=>{const mt=tl.meas[mi],E=mm.events;
    E.forEach((e,j)=>{const s=mt.start+e.tick*mt.spt,d=e.ticks*mt.spt,need=(j===E.length-1?EN_BAR+22:26)+6*(e.dots||0)+(e.tup?3:0)+(!e.rest&&(e.type==='w'||e.type==='b')?5:0);
      out.push({s,e:s+d,v:clamp(need/d,EN_VMIN,520)});});});
  return out;
}
function enMap(T,segs,vL,vR){
  const dt=0.004,N=Math.max(1,Math.ceil(T/dt)),xs=new Float64Array(N+1);
  const V=t=>{let v=EN_VMIN;if(vL)v=Math.max(v,vL-EN_SLOPE*t);if(vR)v=Math.max(v,vR-EN_SLOPE*(T-t));
    for(const s of segs){const d=t<s.s?s.s-t:t>s.e?t-s.e:0;v=Math.max(v,s.v-EN_SLOPE*d);}return v;};
  let x=0,pt=0,pv=V(0);for(let i=1;i<=N;i++){const t=Math.min(T,i*dt),cv=V(t);x+=(pv+cv)/2*(t-pt);xs[i]=x;pt=t;pv=cv;}
  const X=t=>{if(t<=0)return 0;const f=t/dt,i=Math.floor(f);if(i>=N)return xs[N];return xs[i]+(xs[i+1]-xs[i])*(f-i);};
  return{X,w:xs[N],vStart:V(0),vEnd:V(T)};
}

  if(SCREEN==='play'){padHit(RUN&&RUN.poly?runPad(line||'A'):$('#pPad'));runTap(line);}

}

  $('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'&&!SHEET_LOCK)closeSheet();});

    if(SCREEN==='play'&&RUN&&(RUN.state==='play'||RUN.state==='hint'))runStop();

}

/* =========================================================
   FOND ANIMÉ — tuiles pixel festives.
   • Couleurs : celles de la difficulté du niveau SÉLECTIONNÉ (fiche de niveau ouverte, départ choisi en Arcade/Quiz),
     sinon du niveau où se trouve le joueur. Les teintes glissent lentement vers la nouvelle couleur (~4 s).
   • Mouvement : bandes de couleur qui défilent en diagonale, pulsation sur un tempo (♩ = 100),
     ondes qui partent d'un point au hasard sur certains temps, et tuiles qui scintillent comme des confettis.
   Une tuile = 1 pixel d'un petit canvas agrandi sans lissage : très léger pour le téléphone.
   ========================================================= */
var BG={T:28,last:0,cur:null,tgt:null,focusD:null,waves:[],sparks:new Map(),lastBeat:-1};
var BG_RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
function hex2rgb(h){h=(h||'').trim();if(h[0]==='#'){if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  const m=h.match(/[\d.]+/g);return m?m.slice(0,3).map(Number):[200,200,200];}
function bgTarget(){
  const d=clamp(BG.focusD||LVL_D[frontier()][0],1,10),dark=document.documentElement.hasAttribute('data-dark');
  return{bg:hex2rgb(cssv('--bg')),a:hex2rgb(dColor(d)),b:hex2rgb(dColor(Math.min(10,d+1))),c:hex2rgb(dColor(Math.max(1,d-1))),k:dark?0.2:0.16,amp:dark?0.13:0.11};
}
function bgUpdate(){if(BG&&BG.c){BG.tgt=bgTarget();BG.dirty=true;}}
/* À appeler quand un niveau / une difficulté est sélectionné(e) */
function bgFocus(d){if(!BG)return;BG.focusD=d||null;bgUpdate();}
function bgResize(){
  BG.cols=Math.ceil(innerWidth/BG.T)+1;BG.rows=Math.ceil(innerHeight/BG.T)+1;
  BG.c.width=BG.cols;BG.c.height=BG.rows;BG.c.style.width=BG.cols*BG.T+'px';BG.c.style.height=BG.rows*BG.T+'px';
  BG.img=BG.x.createImageData(BG.cols,BG.rows);BG.dirty=true;
}
function bgFrame(ts){
  BG.raf=requestAnimationFrame(bgFrame);
  if(document.hidden||SCREEN!=='home')return;
  const still=BG_RM&&BG_RM.matches;if(still&&!BG.dirty&&BG.settled)return;
  if(ts-BG.last<33&&!BG.dirty)return;const dt=Math.min(0.2,(ts-(BG.last||ts))/1000);BG.last=ts;BG.dirty=false;
  // couleurs : glissement lent vers la cible
  const C=BG.cur,Tg=BG.tgt,f=1-Math.exp(-dt/1.4);let moving=0;
  ['bg','a','b','c'].forEach(k=>{for(let i=0;i<3;i++){const dl=Tg[k][i]-C[k][i];C[k][i]+=dl*f;moving+=Math.abs(dl);}});
  C.k+=(Tg.k-C.k)*f;C.amp+=(Tg.amp-C.amp)*f;BG.settled=moving<1;
  const t=still?0:ts/1000,W=BG.cols,H=BG.rows,P=BG.img.data,{bg,a,b,c,k,amp}=C;
  // tempo : pulsation + ondes
  const beatLen=60/100,beat=Math.floor(t/beatLen),ph=(t%beatLen)/beatLen,pulse=still?0:Math.exp(-ph*5);
  if(!still&&beat!==BG.lastBeat){BG.lastBeat=beat;
    if(beat%2===0)BG.waves.push({x:Math.random()*W,y:Math.random()*H,t0:t});
    for(let n=0;n<Math.max(3,(W*H)>>6);n++)BG.sparks.set(Math.floor(Math.random()*W*H),t);}
  BG.waves=BG.waves.filter(w=>t-w.t0<3.2);
  for(const [i,t0] of BG.sparks)if(t-t0>0.9)BG.sparks.delete(i);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const m=((Math.sin(x*0.38+y*0.22-t*1.1)+Math.sin(y*0.31-t*0.7)+Math.sin((x-y)*0.19+t*0.5))/3+1)/2;   // bandes qui défilent
    const n=Math.sin(x*0.35-y*0.27+t*0.9);                                                               // 3e teinte qui passe

/* =========================================================
   LANGUES — français (langue source) et anglais.
   La traduction se fait à l'affichage : chaque texte français est cherché dans un dictionnaire.
   Les noms connus (niveaux, mondes, cellules, difficultés…) et les nombres sont remplacés par
   des repères {E0}, {N0}… pour qu'une même phrase serve quels que soient le niveau ou le score.
   ========================================================= */
var LANG=(typeof G!=='undefined'&&G.set&&G.set.lang)||null;
function LOC(){return LANG==='en'?'en-US':'fr-FR';}
var I18N=null,ENT=null,TRD=new WeakMap();
function i18nBuild(){
  I18N=Object.assign({},EN_UI);
  ENT=[];
  const add=(fr,en)=>{if(fr&&en&&fr!==en){ENT.push([fr,en]);}};
  LEVELS.forEach((L,i)=>{const e=EN_LEVELS[i];if(!e)return;I18N[L.t]=e[0];I18N[L.d]=e[1];add(L.t,e[0]);});
  WORLDS.forEach(w=>{const e=EN_WORLDS[w.title];if(e){I18N[w.title]=e;add(w.title,e);}});
  Object.values(CELLS).forEach(c=>{const e=c&&c.name&&EN_CELLS[c.id];if(e){I18N[c.name]=I18N[c.name]||e;add(c.name,e);}});
  STEP_INFO.forEach((s,i)=>{const e=EN_STEPS[i];I18N[s.label]=e[0];I18N[s.sub]=e[1];add(s.label,e[0]);add(s.sub,e[1]);});
  DIFF_NAMES.forEach((n,i)=>{I18N[n]=EN_DIFF[i];add(n,EN_DIFF[i]);});
  RANKS.forEach((r,i)=>{I18N[r[1]]=EN_RANKS[i];add(r[1],EN_RANKS[i]);});
  if(typeof ACH!=='undefined')ACH.forEach(b=>{const e=EN_ACH[b.id];if(!e)return;I18N[b.t]=e[0];if(b.d&&e[1])I18N[b.d]=e[1];if(b.hint&&e[2])I18N[b.hint]=e[2];add(b.t,e[0]);});
  const seen=new Set();ENT=ENT.filter(([f])=>!seen.has(f)&&seen.add(f));
  ENT.sort((a,b)=>b[0].length-a[0].length);
}
var NUM_RE=/\d+(?:[\u202f\u00a0]\d{3})*(?:,\d+)?/g;
function i18nNorm(core){
  const ents=[],nums=[];let k=core;
  for(const [fr,en] of ENT){if(k.includes(fr)){k=k.split(fr).join('\u0001'+String.fromCharCode(65+ents.length)+'\u0002');ents.push(en);}}
  k=k.replace(NUM_RE,x=>{nums.push(x);return'{N'+(nums.length-1)+'}';});
  k=k.replace(/\u0001([A-Z])\u0002/g,(x,c)=>'{E'+(c.charCodeAt(0)-65)+'}');
  return{k,ents,nums};
}
function enNum(x){return x.replace(/[\u202f\u00a0](\d{3})/g,',$1');}
var PFX_RE=/^([^A-Za-zÀ-ÿ0-9«“"'(+\-]+)([\s\S]*)$/;
function tr1(core){
  if(I18N[core]!=null)return I18N[core];
  const pm=core.match(PFX_RE);if(pm&&pm[2])return pm[1]+tr1(pm[2]);
  const {k,ents,nums}=i18nNorm(core);const t=I18N[k];
  if(t==null){if(window.I18N_MISS)window.I18N_MISS.add(k);return core;}
  return t.replace(/\{E(\d+)\}/g,(_,i)=>ents[i]).replace(/\{N(\d+)\}/g,(_,i)=>enNum(nums[i]));
}
function tr(s){
  if(LANG!=='en'||!s||!I18N)return s;
  const m=s.match(/^([ \t\n\r]*)([\s\S]*?)([ \t\n\r]*)$/),core=m[2].replace(/[ \t\n\r]+/g,' ');
  if(!core||!/[A-Za-zÀ-ÿ]/.test(core))return s.replace(/(\d)[ \u00a0\u202f]%/g,'$1%');
  let out;
  if(I18N[core]!=null)out=I18N[core];
  else if(core.includes(' · '))out=core.split(' · ').map(tr1).join(' · ');
  else out=tr1(core);
  return m[1]+out.replace(/(\d)[ \u00a0\u202f]%/g,'$1%')+m[3];
}
/* Application au DOM */
var I18N_SKIP='script,style,#bgGrid,#bgTiles,[translate=no],.ql';
function i18nNode(n){
  if(n.nodeType===3){
    const p=n.parentElement;if(!p)return;
    if(p.closest('svg')&&!p.closest('.hand')){return;}
    if(p.closest(I18N_SKIP))return;
    const v=n.nodeValue;if(TRD.get(n)===v)return;
    let t;
    if((v==='D'||v==='G')&&p.closest('.hand,.pads2,.handic'))t=v==='D'?'R':'L';else t=tr(v);
    if(t!==v){n.nodeValue=t;}TRD.set(n,n.nodeValue);
  }else if(n.nodeType===1){
    if(n.matches&&n.matches(I18N_SKIP))return;
    ['aria-label','title'].forEach(a=>{const v=n.getAttribute&&n.getAttribute(a);if(v){const t=tr(v);if(t!==v)n.setAttribute(a,t);}});
    if(n.tagName==='svg'&&!n.querySelector('.hand'))return;
    n.childNodes.forEach(i18nNode);
  }
}
var I18N_OBS=null;
function i18nApply(){
  document.documentElement.lang=LANG||'fr';
  document.title=LANG==='en'?'Rhythms — the game':'Rythmes — le jeu';
  if(LANG==='en'){if(!I18N)i18nBuild();i18nNode(document.body);
    if(!I18N_OBS){I18N_OBS=new MutationObserver(ms=>{if(LANG!=='en')return;ms.forEach(m=>{if(m.type==='characterData')i18nNode(m.target);else if(m.type==='attributes')i18nNode(m.target);else m.addedNodes.forEach(i18nNode);});});
      I18N_OBS.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title']});}}
}
function setLang(l){LANG=l;G.set.lang=l;save();if(l==='fr'){TRD=new WeakMap();}
  i18nApply();if(typeof renderTab==='function'){renderTop();renderTab();}
  if(SCREEN==='settings')renderSettings();
  if(l==='fr')location.reload();}
/* Choix de la langue au premier lancement */
function langPicker(){
  const d=document.createElement('div');d.id='langPick';d.setAttribute('translate','no');
  d.innerHTML=`<div class="lpbox"><div class="lpt">Rythmes</div><p>Choisis ta langue<br><span>Choose your language</span></p>
    <button class="btn primary big" data-l="fr">Français</button><button class="btn primary big" data-l="en">English</button></div>`;
  document.body.appendChild(d);
  d.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{d.remove();setLang(b.dataset.l);});
}

/* Démarrage : choix de la langue la première fois, sinon langue mémorisée */
if(!G.set.lang)langPicker();else if(G.set.lang==='en')i18nApply();

</script>
